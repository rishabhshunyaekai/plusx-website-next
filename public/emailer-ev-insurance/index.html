<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>PlusX Insurance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SN99F8K5TS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-SN99F8K5TS');
    </script>
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua);
      var isAndroid = /Android/.test(ua);

      // Give the OS ~1s to hand off to the app (if installed via Universal/App Links)
        if (document.visibilityState === 'hidden') return; // app likely opened
        if (isIOS) {
          window.location.replace('https://apps.apple.com/in/app/plusx-electric/id6503144034');
        } else if (isAndroid) {
          window.location.replace('https://play.google.com/store/apps/details?id=com.shunyaekai.plusexelectric&hl=en_IN');
        } else {
          // Desktop fallback – send to a landing page or both store links
          window.location.replace('https://plusxelectric.com/');
        }
    })();
  </script>
</head>
<body>
  <noscript>
    If you are not redirected, <a href="https://plusxelectric.com/">click here</a>.
  </noscript>
</body>
</html>
